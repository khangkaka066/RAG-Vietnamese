name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: Run offline evaluation (lexical retriever, no API key)
        env:
          VIETNAMESE_RETRIEVER: lexical
        run: python scripts/run_eval.py --json-out reports/eval.json --csv-out reports/eval.csv
      - name: Enforce evaluation quality gate
        run: >
          python scripts/check_eval_gate.py reports/eval.json
          --min-hit-rate 0.8 --min-mrr 0.7 --min-citation-coverage 0.8 --min-faithfulness 0.6
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: reports/

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t vietnamese-rag-eval .
