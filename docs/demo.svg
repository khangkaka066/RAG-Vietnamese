<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Vietnamese RAG evaluation service demo</title>
  <desc id="desc">A visual demo of two API requests: a calculation routed to a tool and a Vietnamese knowledge question routed through retrieval with citations.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#c084fc"/>
    </marker>
    <style>
      .ui { font-family: Arial, Helvetica, sans-serif; }
      .title { fill: #f8fafc; font-size: 34px; font-weight: 700; letter-spacing: 0px; }
      .subtitle { fill: #94a3b8; font-size: 15px; }
      .label { fill: #94a3b8; font-size: 12px; font-weight: 650; letter-spacing: 1.1px; }
      .body { fill: #dbeafe; font-size: 15px; }
      .muted { fill: #94a3b8; font-size: 13px; }
      .small { fill: #cbd5e1; font-size: 12px; }
      .mono { font-family: monospace; fill: #dbeafe; }
    </style>
  </defs>

  <rect width="1400" height="820" fill="url(#bg)"/>
  <circle cx="1250" cy="70" r="180" fill="#2563eb" opacity="0.08" filter="url(#soft-glow)"/>
  <circle cx="90" cy="760" r="170" fill="#7c3aed" opacity="0.08" filter="url(#soft-glow)"/>

  <g class="ui">
    <text x="80" y="76" class="title">Vietnamese RAG · made observable</text>
    <text x="80" y="108" class="subtitle">One API contract for grounded answers, tool routing, citations, and repeatable evaluation.</text>
    <rect x="1118" y="58" width="202" height="36" rx="18" fill="#132238" stroke="#28476d"/>
    <circle cx="1141" cy="76" r="6" fill="#34d399"/>
    <text x="1157" y="81" class="small">OFFLINE-READY</text>

    <!-- request rail -->
    <rect x="80" y="148" width="1240" height="96" rx="18" fill="#0f172a" stroke="#22324b"/>
    <rect x="104" y="172" width="118" height="48" rx="12" fill="url(#blue)"/>
    <text x="163" y="202" text-anchor="middle" fill="#eff6ff" font-size="14" font-weight="750">POST /query</text>
    <line x1="240" y1="196" x2="1148" y2="196" stroke="#334155" stroke-width="2" stroke-dasharray="5 8"/>
    <circle cx="432" cy="196" r="9" fill="#0f172a" stroke="#60a5fa" stroke-width="3"/>
    <circle cx="744" cy="196" r="9" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="1050" cy="196" r="9" fill="#0f172a" stroke="#34d399" stroke-width="3"/>
    <text x="432" y="178" text-anchor="middle" class="small">request</text>
    <text x="744" y="178" text-anchor="middle" class="small">route</text>
    <text x="1050" y="178" text-anchor="middle" class="small">auditable answer</text>

    <!-- tool card -->
    <rect x="80" y="286" width="600" height="354" rx="20" fill="#101a2b" stroke="#244164" filter="url(#shadow)"/>
    <rect x="80" y="286" width="600" height="6" rx="3" fill="url(#violet)"/>
    <text x="112" y="334" class="label">EXAMPLE 01 · TOOL ROUTING</text>
    <rect x="112" y="357" width="536" height="66" rx="12" fill="#0b1220" stroke="#24354d"/>
    <text x="136" y="385" class="muted">query</text>
    <text x="136" y="408" fill="#dbeafe" font-family="monospace" font-size="15">tính 2 + 3 * 4</text>
    <path d="M380 450V484" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-violet)"/>
    <rect x="112" y="496" width="536" height="112" rx="12" fill="#16152b" stroke="#7248ad"/>
    <rect x="136" y="518" width="74" height="24" rx="12" fill="#3b1f6b"/>
    <text x="173" y="535" text-anchor="middle" fill="#e9d5ff" font-size="11" font-weight="750">TOOL</text>
    <text x="136" y="568" fill="#f5f3ff" font-size="17" font-weight="700">Kết quả: 2 + 3 * 4 = 14.</text>
    <text x="136" y="590" class="muted">calculate · 0.04 ms · trace captured</text>
    <text x="112" y="674" class="small">No retrieval needed · deterministic · safe AST evaluation</text>

    <!-- rag card -->
    <rect x="720" y="286" width="600" height="354" rx="20" fill="#101a2b" stroke="#244164" filter="url(#shadow)"/>
    <rect x="720" y="286" width="600" height="6" rx="3" fill="url(#green)"/>
    <text x="752" y="334" class="label">EXAMPLE 02 · GROUNDED RAG</text>
    <rect x="752" y="357" width="536" height="66" rx="12" fill="#0b1220" stroke="#24354d"/>
    <text x="776" y="385" class="muted">query</text>
    <text x="776" y="408" class="body">RAG cần đánh giá bằng những chỉ số nào?</text>
    <path d="M1020 450V484" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
    <rect x="752" y="496" width="536" height="112" rx="12" fill="#0f2929" stroke="#23785d"/>
    <rect x="776" y="518" width="66" height="24" rx="12" fill="#124e3d"/>
    <text x="809" y="535" text-anchor="middle" fill="#bbf7d0" font-size="11" font-weight="750">RAG</text>
    <text x="776" y="568" fill="#ecfdf5" font-size="16" font-weight="700">Hit-rate · MRR · citations · faithfulness</text>
    <text x="776" y="590" class="muted">retrieved evidence attached · answer grounded</text>
    <text x="752" y="674" class="small">Lexical baseline by default · embedding / hybrid are opt-in</text>

    <!-- footer metrics -->
    <rect x="80" y="712" width="1240" height="58" rx="16" fill="#0f172a" stroke="#22324b"/>
    <text x="112" y="747" class="label">QUALITY GATE</text>
    <line x1="250" y1="728" x2="250" y2="754" stroke="#293b55"/>
    <text x="282" y="745" fill="#f8fafc" font-size="18" font-weight="750">1.0</text>
    <text x="318" y="745" class="small">retrieval hit-rate</text>
    <text x="525" y="745" fill="#f8fafc" font-size="18" font-weight="750">1.0</text>
    <text x="562" y="745" class="small">MRR@3</text>
    <text x="700" y="745" fill="#f8fafc" font-size="18" font-weight="750">1.0</text>
    <text x="737" y="745" class="small">citation coverage</text>
    <text x="950" y="745" fill="#f8fafc" font-size="18" font-weight="750">20</text>
    <text x="984" y="745" class="small">checked-in cases</text>
    <text x="1166" y="745" fill="#34d399" font-size="13" font-weight="750">CI READY</text>
  </g>
</svg>
