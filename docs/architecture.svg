<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 900" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2ea043" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a371f7" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="900" fill="#0d1117" />

  <text x="650" y="42" text-anchor="middle" fill="#e6edf3" font-size="30" font-weight="bold">System Architecture</text>
  <text x="650" y="66" text-anchor="middle" fill="#8b949e" font-size="13">vietnamese-rag-evaluation — request flow</text>

  <!-- Client -->
  <rect x="510" y="90" width="280" height="50" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="2" />
  <text x="650" y="110" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="bold">Client</text>
  <text x="650" y="128" text-anchor="middle" fill="#8b949e" font-size="13">User query</text>

  <!-- FastAPI panel -->
  <rect x="60" y="175" width="1180" height="665" rx="14" fill="none" stroke="#30363d" stroke-width="2" />
  <text x="78" y="192" fill="#8b949e" font-size="13">FastAPI service — /query · /tools/call · /evaluate</text>

  <!-- RuleRouter -->
  <rect x="510" y="210" width="280" height="55" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2" />
  <text x="650" y="233" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="bold">RuleRouter</text>
  <text x="650" y="251" text-anchor="middle" fill="#8b949e" font-size="13">rule-based, offline</text>

  <!-- Document loader -->
  <rect x="110" y="320" width="510" height="60" rx="10" fill="#161b22" stroke="#2ea043" stroke-width="2" />
  <text x="365" y="356" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="bold">Document loader</text>

  <!-- Retriever -->
  <rect x="110" y="415" width="510" height="60" rx="10" fill="#161b22" stroke="#2ea043" stroke-width="2" />
  <text x="365" y="441" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="bold">Retriever</text>
  <text x="365" y="459" text-anchor="middle" fill="#8b949e" font-size="13">lexical · embedding · hybrid</text>

  <!-- Generator -->
  <rect x="110" y="510" width="510" height="80" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="2" />
  <text x="365" y="538" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="bold">Generator</text>
  <text x="365" y="557" text-anchor="middle" fill="#8b949e" font-size="13">OpenRouter LLM (citations required)</text>
  <text x="365" y="573" text-anchor="middle" fill="#8b949e" font-size="13">falls back to extractive if no key / LLMError</text>

  <!-- ToolRegistry -->
  <rect x="700" y="415" width="490" height="60" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="2" />
  <text x="945" y="441" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="bold">ToolRegistry.call_with_trace</text>
  <text x="945" y="459" text-anchor="middle" fill="#8b949e" font-size="13">calculate · current_datetime</text>

  <!-- Answer -->
  <rect x="430" y="650" width="440" height="65" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="2" />
  <text x="650" y="678" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="bold">Answer</text>
  <text x="650" y="697" text-anchor="middle" fill="#8b949e" font-size="13">route · route_reason · tool_trace · citations</text>

  <!-- Arrows -->
  <line x1="650" y1="140" x2="650" y2="208" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow-gray)" />

  <line x1="610" y1="265" x2="380" y2="316" stroke="#2ea043" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="487" y="291" text-anchor="middle" fill="#2ea043" font-size="13">route = rag</text>

  <line x1="690" y1="265" x2="900" y2="411" stroke="#a371f7" stroke-width="2" marker-end="url(#arrow-purple)" />
  <text x="818" y="340" text-anchor="middle" fill="#a371f7" font-size="13">route = tool</text>

  <line x1="365" y1="380" x2="365" y2="413" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow-gray)" />
  <line x1="365" y1="475" x2="365" y2="508" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow-gray)" />
  <line x1="365" y1="590" x2="550" y2="648" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow-gray)" />
  <line x1="945" y1="475" x2="750" y2="648" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow-gray)" />

  <!-- Legend -->
  <rect x="90" y="860" width="16" height="16" fill="#2ea043" />
  <text x="114" y="873" fill="#8b949e" font-size="13">RAG path</text>
  <rect x="210" y="860" width="16" height="16" fill="#a371f7" />
  <text x="234" y="873" fill="#8b949e" font-size="13">Tool path</text>
  <rect x="330" y="860" width="16" height="16" fill="#d29922" />
  <text x="354" y="873" fill="#8b949e" font-size="13">Router</text>
  <rect x="440" y="860" width="16" height="16" fill="#1f6feb" />
  <text x="464" y="873" fill="#8b949e" font-size="13">API / generation</text>
</svg>
