[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnamese-rag-evaluation"
version = "0.1.0"
description = "Vietnamese RAG, grounded answers, tool routing, and evaluation service"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
demo = [
  "Pillow>=10.0",
  "fonttools>=4.0",
]
embeddings = [
  "sentence-transformers>=3.0",
]
tracking = [
  "mlflow>=2.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
